    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233c" x="18" y="32.437031" transform="rotate(-0 18 32.437031)">Routine tissue to a development decision</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6780" x="18" y="52.617191" transform="rotate(-0 18 52.617191)">Proposed application informed by computational-pathology research</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233c" x="50.643" y="91.813271" transform="rotate(-0 50.643 91.813271)">1  Define the information gap</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6780" x="50.643" y="113.545751" transform="rotate(-0 50.643 113.545751)">Prognostic risk, a biomarker hypothesis or assay prioritization</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233c" x="50.643" y="173.310071" transform="rotate(-0 50.643 173.310071)">2  Test the image-derived signal</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6780" x="50.643" y="195.042551" transform="rotate(-0 50.643 195.042551)">Patient-level separation · independent cohorts · uncertainty</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233c" x="50.643" y="254.806871" transform="rotate(-0 50.643 254.806871)">3  Establish the intended use</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6780" x="50.643" y="276.539351" transform="rotate(-0 50.643 276.539351)">Prognostic risk does not establish differential treatment benefit</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233c" x="50.643" y="336.303671" transform="rotate(-0 50.643 336.303671)">4  Decide whether to expand</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5c6780" x="50.643" y="358.036151" transform="rotate(-0 50.643 358.036151)">Value of added information vs. validation and implementation cost</text>
   </g>
